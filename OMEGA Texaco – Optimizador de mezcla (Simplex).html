<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMEGA Texaco – Optimizador de mezcla (Simplex)</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dde3;--ac:#c8102e;--ok:#0a7d3c}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa4af;--bd:#343b44;--ac:#ff5a6e;--ok:#4cd07d}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:900px;margin:0 auto;padding:20px 14px 50px}
h1{font-size:22px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--mu);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 6px;text-align:left}
th{font-size:12px;color:var(--mu);font-weight:600}
input{font:inherit;color:inherit;background:transparent;border:1px solid var(--bd);border-radius:6px;padding:5px 7px;width:100%;min-width:70px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
label{font-size:12px;color:var(--mu);display:block}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:transparent;color:inherit;padding:7px 14px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.big{font-size:26px;font-weight:700;color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--bd);border-radius:8px;padding:10px}.kpi b{display:block;font-size:20px}
.err{color:var(--ac);font-weight:600}
input.bad{border-color:var(--ac);background:rgba(200,16,46,.08)}
ul.err{margin:6px 0 0;padding-left:20px}
.scroll{overflow-x:auto}
.t td,.t th{border:1px solid var(--bd);text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;padding:3px 7px}
.t td:first-child,.t th:first-child{text-align:left}
.piv{background:rgba(200,16,46,.18)}
details{margin-top:8px}summary{cursor:pointer;color:var(--mu)}
.mix{display:flex;height:26px;border-radius:6px;overflow:hidden;margin:8px 0}
.mix div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
</style>
</head>
<body>
<main>
<h1>OMEGA Texaco – Optimizador de mezcla de gasolina</h1>
<p class="sub">Minimiza el costo de la mezcla con el Método Simplex de dos fases, respetando octanaje, demanda y disponibilidad.</p>

<div class="card">
  <h2>1. Componentes de entrada</h2>
  <div class="scroll"><table id="comp">
    <thead><tr><th>Nombre</th><th>Costo ($/bbl)</th><th>Octanaje</th><th>Disponibilidad máx. (bbl)</th><th></th></tr></thead>
    <tbody></tbody>
  </table></div>
  <div class="row2">
    <div><label>Octanaje mínimo de la mezcla</label><input id="oct" type="number" min="0" step="any" value="88"></div>
    <div><label>Demanda mínima total (bbl)</label><input id="dem" type="number" min="0" step="any" value="50"></div>
  </div>
  <div class="bar">
    <button onclick="addRow()">+ Agregar componente</button>
    <button onclick="ejemplo()">Cargar caso del PDF</button>
    <button class="p" onclick="resolver()">Resolver</button>
    <span id="msg" style="align-self:center;color:var(--ok)"></span>
  </div>
</div>

<div class="card" id="res" hidden>
  <h2>2. Resultado</h2>
  <div id="out"></div>
</div>
</main>

<script>
const EPS=1e-9, COL=['#c8102e','#1f6feb','#e0a100','#2da44e','#8250df','#e16f24'];
function addRow(n='',c='',o='',a=''){
  const tb=document.querySelector('#comp tbody'), i=tb.rows.length+1, r=tb.insertRow();
  r.innerHTML=`<td><input value="${n||'Componente '+i}"></td><td><input type="number" step="any" min="0" value="${c}"></td><td><input type="number" step="any" min="0" value="${o}"></td><td><input type="number" step="any" min="0" value="${a}" placeholder="sin límite"></td><td><button onclick="this.closest('tr').remove()" title="Quitar">✕</button></td>`;
}
function ejemplo(){
  document.querySelector('#comp tbody').innerHTML='';
  addRow('Componente 1',40,80,100); addRow('Componente 2',60,95,80);
  document.getElementById('oct').value=88; document.getElementById('dem').value=50;
  document.getElementById('res').hidden=true;
  const m=document.getElementById('msg'); if(m){m.textContent='✔ Caso del PDF cargado';setTimeout(()=>m.textContent='',2500)}
}

/* ---------- Simplex de dos fases ---------- */
function f(x){return (Math.abs(x)<1e-9?0:x).toLocaleString('es-CO',{maximumFractionDigits:3,minimumFractionDigits:0})}
function snap(log,title,T,base,names,pr,pc){log.push({title,T:T.map(r=>r.slice()),base:base.slice(),names,pr,pc})}
function pivot(T,r,c){const p=T[r][c];T[r]=T[r].map(v=>v/p);
  for(let i=0;i<T.length;i++)if(i!==r&&Math.abs(T[i][c])>0){const m=T[i][c];T[i]=T[i].map((v,j)=>v-m*T[r][j])}}
function iterate(T,base,names,allowed,log,label){
  let it=0;
  for(;;){
    let c=-1,best=-EPS;
    for(const j of allowed)if(T[T.length-1][j]<best){best=T[T.length-1][j];c=j}
    if(c<0)return 'optimo';
    let r=-1,rm=Infinity;
    for(let i=0;i<T.length-1;i++)if(T[i][c]>EPS){const q=T[i][T[i].length-1]/T[i][c];if(q<rm-EPS){rm=q;r=i}}
    if(r<0)return 'no_acotado';
    snap(log,`${label} – iteración ${it+1}: entra ${names[c]}, sale ${names[base[r]]}`,T,base,names,r,c);
    pivot(T,r,c);base[r]=c;it++;
    if(it>500)return 'ciclo';
  }
}
function simplex(cost,R){
  const n=cost.length,m=R.length,log=[];
  const names=cost.map((_,i)=>'X'+(i+1)),extra=[],base=[],art=[];
  R=R.map(x=>x.b<0?{a:x.a.map(v=>-v),s:{'>=':'<=','<=':'>=','=':'='}[x.s],b:-x.b}:x);
  R.forEach((x,i)=>{
    if(x.s==='<='){extra.push([i,1]);names.push('s'+(i+1));base.push(names.length-1)}
    else{ if(x.s==='>='){extra.push([i,-1]);names.push('s'+(i+1))}
      extra.push([i,1]);names.push('A'+(i+1));art.push(names.length-1);base.push(names.length-1)}
  });
  const N=names.length,T=Array.from({length:m+1},()=>Array(N+1).fill(0));
  R.forEach((x,i)=>{x.a.forEach((v,j)=>T[i][j]=v);T[i][N]=x.b});
  extra.forEach(([i,v],k)=>T[i][n+k]=v);
  if(art.length){
    art.forEach(j=>T[m][j]=1);
    for(let i=0;i<m;i++)if(art.includes(base[i]))T[m]=T[m].map((v,j)=>v-T[i][j]);
    const all=[...Array(N).keys()];
    iterate(T,base,names,all,log,'Fase 1');
    snap(log,'Fase 1 – tabla final (r = '+f(-T[m][N])+')',T,base,names);
    if(-T[m][N]>1e-7)return{estado:'infactible',log};
    for(let i=0;i<m;i++)if(art.includes(base[i])){
      const j=[...Array(N).keys()].find(j=>!art.includes(j)&&Math.abs(T[i][j])>EPS);
      if(j!==undefined){pivot(T,i,j);base[i]=j}}
  }
  const c=[...cost,...Array(N-n).fill(0)];
  T[m]=[...c,0];
  for(let i=0;i<m;i++){const cb=c[base[i]];if(cb)T[m]=T[m].map((v,j)=>v-cb*T[i][j])}
  const allowed=[...Array(N).keys()].filter(j=>!art.includes(j));
  const est=iterate(T,base,names,allowed,log,'Fase 2');
  if(est!=='optimo')return{estado:est,log};
  snap(log,'Fase 2 – tabla óptima final',T,base,names);
  const x=Array(n).fill(0);
  for(let i=0;i<m;i++)if(base[i]<n)x[base[i]]=T[i][N];
  const sl={};for(let i=0;i<m;i++)if(names[base[i]][0]==='s')sl[names[base[i]]]=T[i][N];
  return{estado:'optimo',x,z:-T[m][N],log,sl};
}

/* ---------- Interfaz ---------- */
function tabla(s){
  const h=['Base',...s.names,'Sol.'].map(x=>`<th>${x}</th>`).join('');
  const rows=s.T.map((r,i)=>{
    const last=i===s.T.length-1;
    return `<tr><td>${last?'Z':s.names[s.base[i]]}</td>`+r.map((v,j)=>{
      const p=(i===s.pr&&j===s.pc)?' class="piv"':'';return `<td${p}>${f(v)}</td>`}).join('')+'</tr>'}).join('');
  return `<details><summary>${s.title}</summary><div class="scroll"><table class="t"><thead><tr>${h}</tr></thead><tbody>${rows}</tbody></table></div></details>`;
}
function validar(){
  document.querySelectorAll('input.bad').forEach(x=>x.classList.remove('bad'));
  const errs=[],bad=(el,m)=>{el.classList.add('bad');errs.push(m)};
  const num=el=>el.value.trim()===''?NaN:Number(el.value);
  const trs=[...document.querySelectorAll('#comp tbody tr')];
  if(!trs.length)errs.push('Agrega al menos un componente.');
  trs.forEach(tr=>{
    const i=tr.querySelectorAll('input'),nm=i[0].value||'Componente';
    [[1,'costo'],[2,'octanaje']].forEach(([k,t])=>{
      const v=num(i[k]);
      if(!isFinite(v))bad(i[k],`${nm}: escribe un ${t} válido.`);
      else if(v<0)bad(i[k],`${nm}: el ${t} no puede ser negativo.`)});
    if(i[3].value.trim()!==''){
      const a=num(i[3]);
      if(!isFinite(a))bad(i[3],`${nm}: la disponibilidad no es válida.`);
      else if(a<0)bad(i[3],`${nm}: la disponibilidad no puede ser negativa.`)}
  });
  const oe=document.getElementById('oct'),de=document.getElementById('dem'),o=num(oe),d=num(de);
  if(!isFinite(o))bad(oe,'Escribe un octanaje mínimo válido.');
  else if(o<0)bad(oe,'El octanaje mínimo no puede ser negativo.');
  if(!isFinite(d))bad(de,'Escribe una demanda mínima válida.');
  else if(d<=0)bad(de,'La demanda mínima debe ser mayor que cero.');
  return errs;
}
function resolver(){
  const errs=validar();
  if(errs.length){
    document.getElementById('res').hidden=false;
    document.getElementById('out').innerHTML='<p class="err">Corrige los datos antes de resolver:</p><ul class="err">'+errs.map(e=>`<li>${e}</li>`).join('')+'</ul>';
    return}
  const rows=[...document.querySelectorAll('#comp tbody tr')].map(r=>{
    const i=r.querySelectorAll('input');return{n:i[0].value||'?',c:parseFloat(i[1].value),o:parseFloat(i[2].value),a:i[3].value===''?null:parseFloat(i[3].value)}});
  const O=parseFloat(document.getElementById('oct').value),D=parseFloat(document.getElementById('dem').value),box=document.getElementById('out');
  document.getElementById('res').hidden=false;
  if(rows.length<1||rows.some(r=>isNaN(r.c)||isNaN(r.o))||isNaN(O)||isNaN(D)){
    box.innerHTML='<p class="err">Completa costo y octanaje de todos los componentes, el octanaje mínimo y la demanda.</p>';return}
  const n=rows.length,R=[];
  R.push({a:rows.map(r=>r.o-O),s:'>=',b:0});
  R.push({a:Array(n).fill(1),s:'>=',b:D});
  rows.forEach((r,i)=>{if(r.a!==null&&!isNaN(r.a)){const a=Array(n).fill(0);a[i]=1;R.push({a,s:'<=',b:r.a})}});
  const s=simplex(rows.map(r=>r.c),R);
  if(s.estado!=='optimo'){
    const msg={infactible:'El problema es <b>infactible</b>: con esos componentes no se puede cumplir el octanaje, la demanda y las disponibilidades a la vez.',
      no_acotado:'El problema es no acotado.',ciclo:'El algoritmo no convergió.'}[s.estado];
    box.innerHTML=`<p class="err">${msg}</p>`+s.log.map(tabla).join('');return}
  const tot=s.x.reduce((a,b)=>a+b,0),octMezcla=rows.reduce((a,r,i)=>a+r.o*s.x[i],0)/tot;
  const bar=s.x.map((v,i)=>v>1e-9?`<div style="flex:${v};background:${COL[i%COL.length]}" title="${rows[i].n}">${(v/tot*100).toFixed(1)}%</div>`:'').join('');
  const det=rows.map((r,i)=>`<tr><td style="color:${COL[i%COL.length]}">■ ${r.n}</td><td>${s.x[i].toFixed(2)} bbl</td><td>$${(s.x[i]*r.c).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})}</td><td>${r.a===null?'—':(r.a-s.x[i]).toFixed(2)+' bbl'}</td></tr>`).join('');
  box.innerHTML=`<div class="kpis">
    <div class="kpi">Costo mínimo Z*<b>$${s.z.toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})}</b></div>
    <div class="kpi">Volumen total<b>${tot.toFixed(2)} bbl</b></div>
    <div class="kpi">Octanaje de la mezcla<b>${octMezcla.toFixed(2)}</b></div></div>
    <div class="mix">${bar}</div>
    <div class="scroll"><table><thead><tr><th>Componente</th><th>Cantidad óptima</th><th>Costo</th><th>Sobrante</th></tr></thead><tbody>${det}</tbody></table></div>
    <h2 style="margin-top:18px">Iteraciones del Simplex</h2>${s.log.map(tabla).join('')}`;
}
document.addEventListener('input',e=>e.target.classList&&e.target.classList.remove('bad'));
ejemplo();
</script>
</body>
</html>
